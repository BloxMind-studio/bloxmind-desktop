name: BloxMind programs

# Signs bloxmind-programs/manifest.json and publishes it to the rolling
# `bloxmind-programs` prerelease, where BloxMind downloads it (see
# electron/services/BloxMindProgramStore.ts). A prerelease is never the
# repository's "latest" release, so electron-updater never mistakes it for an
# app update.

on:
  push:
    branches: [main]
    paths:
      - "bloxmind-programs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bloxmind-programs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the default branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "BloxMind programs are only published from main, not ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sign the manifest
        env:
          BLOXMIND_PROGRAMS_SIGNING_KEY: ${{ secrets.BLOXMIND_PROGRAMS_SIGNING_KEY }}
        run: pnpm bloxmind-programs sign signed

      - name: Publish to the bloxmind-programs prerelease
        run: |
          if [ ! -f signed/manifest.json ]; then
            echo "Nothing new to publish."
            exit 0
          fi
          if ! gh release view bloxmind-programs >/dev/null 2>&1; then
            gh release create bloxmind-programs --prerelease --latest=false \
              --title "BloxMind programs" \
              --notes "Signed BloxMind programs that BloxMind downloads. Published automatically from bloxmind-programs/ on main; not an app release."
          fi
          gh release upload bloxmind-programs signed/manifest.json signed/manifest.json.sig --clobber
