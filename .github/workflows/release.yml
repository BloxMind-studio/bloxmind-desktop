name: Release

# Windows code signing
# --------------------
# Only this workflow signs Windows builds. It passes `sign-windows: true` to
# build.yml, whose Windows job then:
#   1. logs the Azure CLI in with azure/login and GitHub OIDC (no client secret),
#   2. has electron-builder sign the app, its executables and the NSIS installer
#      through `win.azureSignOptions`. electron-builder runs Invoke-TrustedSigning,
#      whose DefaultAzureCredential picks up the Azure CLI login,
#   3. fails unless Get-AuthenticodeSignature reports a valid, timestamped
#      signature from O=Paralov AS on the installer and win-unpacked/BloxMind.exe.
# CI and pull request builds never sign and need no Azure access.
#
# Until the Azure resources below are pointed at this repository (the federated
# credential must trust repo:BloxMind-studio/bloxmind-desktop:ref:refs/heads/main)
# the Windows job skips signing with a warning and the release is published
# unsigned, with an "unsigned" warning at the top of the release notes. That is
# a testing convenience, not a shipping configuration.
#
# Azure resources it depends on:
#   - Artifact Signing account (AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_ENDPOINT)
#     with the Public Trust certificate profile AZURE_SIGNING_PROFILE, issued to
#     CN=Paralov AS, O=Paralov AS, C=NO.
#   - Entra app registration (AZURE_CLIENT_ID in tenant AZURE_TENANT_ID, with
#     AZURE_SUBSCRIPTION_ID for the CLI login) with a federated credential for
#     repo:paralov/app-bloxbot-ai:ref:refs/heads/main and the "Artifact Signing
#     Certificate Profile Signer" role on the signing account. Runs from any
#     other ref cannot get a token.
# All six values are repository variables, not secrets.
#
# electron-builder writes publisherName "Paralov AS" into app-update.yml, so a
# signed install only accepts updates signed with that name.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the default branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Releases must run from main, not ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Read and validate version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts validate

  build:
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      sign-windows: true
    secrets: inherit

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: BloxMind-*
          path: release
          merge-multiple: true

      # Mirrors the Windows job's check: with the Azure variables absent the
      # installers are unsigned, so say so at the top of the release notes.
      - name: Verify and atomically publish the release
        run: |
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::warning title=Unsigned release::Windows signing is not configured; these installers are unsigned."
            export RELEASE_NOTE_NOTICE="> **This release is unsigned.** The Windows and macOS installers are not code-signed, so Windows SmartScreen and macOS Gatekeeper warn on first launch, and installs signed as \`Paralov AS\` will not auto-update to it."
          fi
          echo "Starting release publication..."
          node scripts/release.ts publish release
          echo "Release published successfully"
