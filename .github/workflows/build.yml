name: Build BloxMind

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: apple-darwin
            builder_args: --mac --x64 --arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            builder_args: --win --x64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            builder_args: --linux deb --x64
    runs-on: ${{ matrix.platform }}
    env:
      VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: repo
        run: |
          echo "Starting dependency installation..."
          pnpm install --frozen-lockfile
          echo "Dependencies installed successfully"

      - name: Run tests
        working-directory: repo
        run: |
          echo "Starting test suite..."
          pnpm test
          echo "Tests completed successfully"

      - name: Type-check
        working-directory: repo
        run: |
          echo "Starting type check..."
          pnpm typecheck
          echo "Type check completed successfully"

      - name: Build application
        working-directory: repo
        run: |
          echo "Starting application build..."
          pnpm build
          echo "Build completed successfully"

      - name: Package application
        shell: bash
        working-directory: repo
        env:
          CSC_LINK: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting electron-builder packaging for ${{ matrix.target }}..."
          pnpm exec electron-builder ${{ matrix.builder_args }} --publish never
          echo "Packaging completed successfully"

      - name: Stage release files
        shell: bash
        working-directory: repo
        run: |
          mkdir staged-release
          find release -maxdepth 1 -type f \( \
            -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.deb' -o -name 'latest*.yml' \
          \) -exec cp {} staged-release/ \;

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BloxMind-${{ matrix.target }}
          if-no-files-found: error
          path: repo/staged-release/*
