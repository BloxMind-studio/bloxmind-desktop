name: Build BloxMind

on:
  workflow_call:
    inputs:
      sign-windows:
        description: >-
          Sign the Windows installer and app with Azure Artifact Signing. Only
          release.yml sets this, and the caller must grant `id-token: write`.
          Signing is skipped with a warning when the Azure repository variables
          are not configured.
        type: boolean
        required: false
        default: false

# No `permissions` here on purpose: a reusable workflow's jobs get the token
# permissions of the calling job. ci.yml grants `contents: read`. release.yml
# also grants `id-token: write` so the Windows job can log in to Azure with OIDC.

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: apple-darwin
            builder_args: --mac --x64 --arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            builder_args: --win --x64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            builder_args: --linux deb --x64
    runs-on: ${{ matrix.platform }}
    env:
      VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
      SIGN_WINDOWS: ${{ inputs.sign-windows && startsWith(matrix.platform, 'windows') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: repo
        run: |
          echo "Starting dependency installation..."
          pnpm install --frozen-lockfile
          echo "Dependencies installed successfully"

      - name: Run tests
        working-directory: repo
        run: |
          echo "Starting test suite..."
          pnpm test
          echo "Tests completed successfully"

      - name: Lint
        working-directory: repo
        run: |
          echo "Starting lint..."
          pnpm lint
          echo "Lint completed successfully"

      - name: Type-check
        working-directory: repo
        run: |
          echo "Starting type check..."
          pnpm typecheck
          echo "Type check completed successfully"

      - name: Build application
        working-directory: repo
        run: |
          echo "Starting application build..."
          pnpm build
          echo "Build completed successfully"

      # electron-builder's own temporary keychain can no longer be unlocked on the
      # macos-26 runner image, so import the certificate into a keychain we manage.
      # The Apple secrets are repository-scoped, so a fork or freshly created repo
      # has none: skip signing with a warning instead of failing on an empty .p12.
      - name: Import macOS signing certificate
        if: startsWith(matrix.platform, 'macos') && github.event_name != 'pull_request'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "::warning title=macOS signing skipped::APPLE_CERTIFICATE is not set for this repository; the macOS build will be unsigned."
            exit 0
          fi
          keychain="$RUNNER_TEMP/bloxbot-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/bloxbot-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$certificate"
          security find-identity -v -p codesigning "$keychain"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # Windows signing uses Azure Artifact Signing (see release.yml for the Azure
      # resources). The Entra app only trusts OIDC tokens for refs/heads/main.
      # The six Azure values are repository-scoped, so a freshly created repo has
      # none: skip signing with a warning instead of failing the release. The
      # publish job repeats this check so the release notes say "unsigned".
      - name: Check Windows signing setup
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Windows signing only runs from main, not ${GITHUB_REF}."
            exit 1
          fi
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "SIGN_WINDOWS=false" >> "$GITHUB_ENV"
            echo "::warning title=Windows signing skipped::${missing[*]} not set for this repository; the Windows installer and app will be unsigned. Installs signed as \"Paralov AS\" will not auto-update to an unsigned build."
            {
              echo "### Windows signing skipped"
              echo ""
              echo "The Windows installer and app are **unsigned** because these repository variables are not set: \`${missing[*]}\`."
              echo ""
              echo "Installs signed as \`Paralov AS\` will not auto-update to an unsigned build."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Windows signing is configured; the Windows build will be signed as \"Paralov AS\"."

      # Logs the Azure CLI in with the GitHub OIDC token. No client secret exists.
      - name: Log in to Azure
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The GitHub OIDC token that the Azure CLI holds expires within minutes, so
      # fetch the Artifact Signing token now. The CLI caches it, and signing reads
      # it through AzureCliCredential while electron-builder packages the app.
      - name: Get Artifact Signing token
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: az account get-access-token --resource https://codesigning.azure.net --output none

      - name: Package application
        shell: bash
        working-directory: repo
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting electron-builder packaging for ${{ matrix.target }}..."
          sign_args=()
          if [[ "$SIGN_WINDOWS" == "true" ]]; then
            sign_args=(
              "-c.win.azureSignOptions.publisherName=Paralov AS"
              "-c.win.azureSignOptions.endpoint=${AZURE_SIGNING_ENDPOINT}"
              "-c.win.azureSignOptions.codeSigningAccountName=${AZURE_SIGNING_ACCOUNT}"
              "-c.win.azureSignOptions.certificateProfileName=${AZURE_SIGNING_PROFILE}"
            )
          fi
          pnpm exec electron-builder ${{ matrix.builder_args }} "${sign_args[@]}" --publish never
          echo "Packaging completed successfully"

      - name: Verify Windows signatures
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        working-directory: repo
        run: |
          $files = @(Get-ChildItem -Path release -Filter 'BloxMind-Setup-*.exe' -File)
          $files += Get-Item -Path 'release/win-unpacked/BloxMind.exe'
          if ($files.Count -lt 2) {
            throw "Expected the NSIS installer and the app executable, found: $($files.Name -join ', ')"
          }
          $failed = $false
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            $subject = $signature.SignerCertificate.Subject
            Write-Host "$($file.Name): $($signature.Status), signer: $subject, timestamped: $($null -ne $signature.TimeStamperCertificate)"
            if ($signature.Status -ne 'Valid' -or $subject -notmatch '(^|, )O=Paralov AS(,|$)' -or $null -eq $signature.TimeStamperCertificate) {
              Write-Host "::error file=$($file.Name)::Not validly signed and timestamped by Paralov AS ($($signature.StatusMessage))"
              $failed = true
            }
          }
          if ($failed) { exit 1 }

      - name: Stage release files
        shell: bash
        working-directory: repo
        run: |
          mkdir staged-release
          find release -maxdepth 1 -type f \( \
            -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.deb' -o -name 'latest*.yml' \
          \) -exec cp {} staged-release/ \;

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BloxMind-${{ matrix.target }}
          if-no-files-found: error
          path: repo/staged-release/*
