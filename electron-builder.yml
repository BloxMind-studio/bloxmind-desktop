appId: ai.BloxMind.desktop
productName: BloxMind
directories:
  output: "release"
  buildResources: "build"
files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "package.json"
extraResources:
  # Shipped to process.resourcesPath/.env and read by electron/licensingConfig.ts
  # for the Roblox OAuth client id and license server URL at runtime.
  - from: ".env"
    to: ".env"
npmRebuild: false
asar: true
mac:
  category: public.app-category.developer-tools
  icon: electron/icons/icon.icns
  identity: null
  hardenedRuntime: true
  artifactName: BloxMind-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
win:
  icon: electron/icons/icon.ico
  artifactName: BloxMind-Setup-${version}.${ext}
  target:
    - nsis
linux:
  category: Development
  icon: electron/icons/icon.png
  artifactName: BloxMind-${version}-linux-amd64.${ext}
  target:
    - deb
publish:
  # Must match the repository that actually hosts the releases (+ the README
  # download links and `git remote`), otherwise electron-updater looks for
  # latest.yml in the wrong place and updates silently never arrive.
  provider: github
  owner: BloxMind-studio
  repo: bloxmind-desktop
  vPrefixedTagName: true
