appId: ai.BloxMind.desktop
productName: BloxMind
directories:
  output: "release"
  buildResources: "build"
files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "package.json"
npmRebuild: false
asar: true
mac:
  category: public.app-category.developer-tools
  icon: electron/icons/bloxmind.icns
  identity: null
  hardenedRuntime: true
  artifactName: BloxMind-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
win:
  icon: electron/icons/bloxmind.ico
  artifactName: BloxMind-Setup-${version}.${ext}
  target:
    - nsis
linux:
  category: Development
  icon: electron/icons/bloxmind.png
  artifactName: BloxMind-${version}-linux-amd64.${ext}
  target:
    - deb
publish:
  provider: github
  owner: YUouriii
  repo: app-BloxMind-ai
  vPrefixedTagName: true
